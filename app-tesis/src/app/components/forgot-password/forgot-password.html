<section class="min-h-screen bg-black flex items-center justify-center p-6 relative overflow-hidden">
  <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-iso-gold/10 rounded-full blur-[120px]"></div>

  <div class="w-full max-w-md z-10">
    <a routerLink="/register" class="flex items-center gap-2 text-iso-gold/50 hover:text-iso-gold transition-colors mb-8 uppercase tracking-[0.3em] text-[10px] group">
      <span class="group-hover:-translate-x-1 transition-transform">← Volver al Registro</span>
    </a>

    <div class="bg-white/[0.03] backdrop-blur-2xl border border-white/10 p-10 rounded-3xl shadow-2xl">
      <div class="text-center mb-10">
        <h2 class="text-white font-serif text-2xl mb-2 tracking-widest uppercase">Recuperar Acceso</h2>
        <div class="w-12 h-px bg-iso-gold/30 mx-auto mb-4"></div>
        <p class="text-gray-500 text-[9px] tracking-[0.2em] uppercase font-light leading-relaxed">
          Ingresa tu correo institucional para recibir las instrucciones de restauración.
        </p>
      </div>

      <div *ngIf="mensajeEnviado" class="text-center py-6">
        <div class="w-16 h-16 bg-iso-gold/20 rounded-full flex items-center justify-center mx-auto mb-6 border border-iso-gold/40">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-iso-gold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        <h3 class="text-white text-sm uppercase tracking-widest mb-2">¡Correo Enviado!</h3>
        <p class="text-gray-500 text-[10px] mb-8 leading-relaxed">{{ successMessage }}</p>
        <button routerLink="/register" class="text-iso-gold text-[9px] uppercase tracking-widest border-b border-iso-gold/30 pb-1 hover:border-iso-gold transition-all">Volver al inicio</button>
      </div>

      <form *ngIf="!mensajeEnviado" [formGroup]="forgotForm" (ngSubmit)="onReset()" class="space-y-6">
        <div *ngIf="errorMessage" class="rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-[10px] uppercase tracking-widest text-red-300">
          {{ errorMessage }}
        </div>

        <div class="space-y-2">
          <label class="text-[9px] text-iso-gold/60 uppercase tracking-widest ml-1">Correo Electrónico</label>
          <input formControlName="email" type="email" placeholder="usuario@elsistema.org" 
            class="w-full bg-white/5 border border-white/10 rounded-xl px-5 py-4 text-white text-sm focus:outline-none focus:border-iso-gold/40 transition-all">
          <p *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" class="text-red-500 text-[8px] uppercase tracking-widest ml-1">Se requiere un correo válido</p>
        </div>

        <button type="submit" [disabled]="isSubmitting"
          class="w-full bg-iso-gold text-black font-bold py-5 rounded-xl uppercase tracking-[0.3em] text-[10px] hover:bg-white transition-all duration-500 shadow-lg shadow-iso-gold/10">
          {{ isSubmitting ? 'ENVIANDO...' : 'ENVIAR INSTRUCCIONES' }}
        </button>
      </form>
    </div>
  </div>
</section>
