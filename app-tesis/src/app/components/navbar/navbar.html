<nav class="sticky top-0 left-0 w-full z-[100] px-4 sm:px-6 py-3 bg-black/20 backdrop-blur-xl border-b border-white/10">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
    <div routerLink="/" class="cursor-pointer group">
      <h1 class="text-white font-serif text-lg sm:text-xl tracking-[0.22em] uppercase group-hover:text-iso-gold transition-colors">
        Iso<span class="text-iso-gold italic">score</span>
      </h1>
    </div>

    <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
      <div *ngIf="!currentUser" class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
        <a routerLink="/login" class="w-full sm:w-auto text-[10px] text-gray-300 hover:text-white uppercase tracking-[0.2em] transition-colors text-center">
          Ingresar
        </a>
        <button routerLink="/register" 
          class="w-full sm:w-auto bg-iso-gold/90 text-black px-5 py-2 rounded-full text-[10px] font-semibold uppercase tracking-[0.18em] hover:bg-iso-gold transition-all duration-300 shadow-sm shadow-iso-gold/10">
          Registrarse
        </button>
      </div>

      <div *ngIf="currentUser as user" class="w-full sm:w-auto flex justify-end">
        <div class="profile-menu-wrapper relative w-full sm:w-auto">
          <button
            type="button"
            (click)="toggleProfileMenu()"
            class="w-full sm:w-auto flex items-center gap-3 rounded-full border border-iso-gold/80 bg-black/40 px-3 py-2 transition-all duration-300 hover:bg-black/70"
          >
            <span class="flex h-11 w-11 items-center justify-center rounded-full border-2 border-iso-gold text-iso-gold">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </span>
            <span class="hidden sm:flex flex-col items-start text-left">
              <span class="text-sm sm:text-base font-semibold text-iso-gold">{{ user.username }}</span>
              <span class="text-[10px] text-white/70 uppercase tracking-[0.15em]">{{ user.is_admin ? 'Administrador' : 'Músico' }}</span>
            </span>
          </button>

          <div
            *ngIf="profileMenuOpen"
            class="absolute right-0 mt-3 w-full sm:w-[320px] rounded-[32px] border border-iso-gold/80 bg-[#111111]/95 p-5 shadow-[0_20px_60px_rgba(0,0,0,0.55)] backdrop-blur-xl"
          >
            <div class="border-b border-white/15 pb-3 mb-4">
              <p class="text-xl sm:text-2xl font-bold uppercase tracking-[0.18em] text-iso-gold">Mis datos</p>
            </div>

            <div class="space-y-3 text-white">
              <p class="text-sm sm:text-base"><span class="font-semibold">Usuario:</span> {{ user.username }}</p>
              <p class="text-sm sm:text-base break-all"><span class="font-semibold">Email:</span> {{ user.email }}</p>
            </div>

            <div class="mt-5 flex flex-col sm:flex-row items-center gap-3">
              <a
                *ngIf="user.is_admin"
                routerLink="/admin"
                (click)="closeProfileMenu()"
                class="w-full sm:w-auto inline-flex items-center justify-center rounded-full border border-iso-gold/80 px-4 py-3 text-[10px] sm:text-xs font-bold uppercase tracking-[0.18em] text-iso-gold transition-all duration-300 hover:bg-iso-gold hover:text-black"
              >
                Panel Admin
              </a>

              <button
                type="button"
                (click)="logout()"
                class="w-full sm:w-auto inline-flex items-center justify-center rounded-full bg-iso-gold px-4 py-3 text-[10px] sm:text-xs font-bold uppercase tracking-[0.18em] text-black transition-colors hover:bg-white"
              >
                Cerrar sesión
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
